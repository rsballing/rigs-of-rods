---
name: Build game

on: [ push, pull_request ]

# Obsolete graphics-preview commits should not consume Windows build capacity.
# Other branches and pull requests retain their normal build behavior.
concurrency:
  group: build-game-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/graphics-overhaul' }}

jobs:
  build-gcc:
    name: Linux build on Ubuntu
    # Linux Conan currently fails on an unrelated libalsa dependency conflict.
    # Keep Windows graphics-preview builds independent of the Linux job.
    if: github.ref != 'refs/heads/graphics-overhaul'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Cache conan
        uses: actions/cache@v6
        with:
          key: conan-ubuntu-${{ hashFiles('conanfile.py') }}
          path: ~/.conan2/

      - name: Install dependencies
        run: |
          curl "https://raw.githubusercontent.com/AnotherFoxGuy/ci-scripts/main/install-conan.sh" | sudo bash
          sudo apt-get update
          sudo apt-get -y install \
                  pkg-config \
                  ninja-build \
                  nvidia-cg-toolkit \
                  libfreetype6-dev \
                  libfreeimage-dev \
                  libzzip-dev \
                  libois-dev \
                  libgl1-mesa-dev \
                  libglu1-mesa-dev \
                  libx11-dev \
                  libxt-dev \
                  libxaw7-dev \
                  libxrandr-dev \
                  libopenjp2-7-dev

        shell: bash

      - name: Configure
        run: |
          conan profile detect --force
          echo "tools.system.package_manager:mode = install" > ~/.conan2/global.conf
          echo "tools.system.package_manager:sudo = True" >> ~/.conan2/global.conf
          conan remote add rigs-of-rods-deps https://nexus.anotherfoxguy.com/repository/rigs-of-rods/ -f
          cmake . -GNinja -DCMAKE_BUILD_TYPE=Release -Bbuild -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=cmake/conan_provider.cmake -DCMAKE_INSTALL_PREFIX=redist -DCREATE_CONTENT_FOLDER=ON
        shell: bash

      - name: Build
        run: |
          cd build
          ninja install
        shell: bash

      - name: Copy *.so files
        run: cmake -P ./tools/CI/copy_libs.cmake
        shell: bash

      - name: Upload build to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        if: env.BUTLER_API_KEY != null && github.ref == 'refs/heads/master'
        run: |
          curl "https://raw.githubusercontent.com/AnotherFoxGuy/ci-scripts/main/install-butler.sh" | sudo bash
          butler push redist rigs-of-rods/rigs-of-rods-dev:linux-ci --userversion CIBuild-${GITHUB_RUN_NUMBER}-commit-${GITHUB_SHA}
        shell: bash

      - name: Upload redist folder
        uses: actions/upload-artifact@v7
        with:
          name: ror-linux
          path: redist

      - name: Clean Conan pkgs
        run: conan cache clean "*" -sbd
        shell: bash

  build-msvc:
    name: Windows build
    runs-on: windows-2025
    permissions:
      contents: write  # Required to create a GitHub prerelease on this fork
    env:
      BUILD_TOOLS_PATH: C:\apps\build-tools\
      CONAN_USER_HOME_SHORT: None
    steps:
      - run: echo $env:BUILD_TOOLS_PATH | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Build tools
        run: git clone https://git.anotherfoxguy.com/AnotherFoxGuy/build-tools.git %BUILD_TOOLS_PATH%
        shell: cmd

      - name: Cache conan packages
        uses: actions/cache@v6
        with:
          key: conan-windows-${{ hashFiles('conanfile.py') }}
          path: ~/.conan2

      - name: Enable Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: |
          conan remote add rigs-of-rods-deps https://nexus.anotherfoxguy.com/repository/rigs-of-rods/ -f
          cmake . -GNinja -DCMAKE_BUILD_TYPE=Release -Bbuild -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=cmake/conan_provider.cmake -DCMAKE_INSTALL_PREFIX=redist -DCREATE_CONTENT_FOLDER=ON
        shell: cmd

      - name: Build
        run: |
          cd build
          ninja install
        shell: cmd

      - name: Bundle signed Microsoft DirectX 9 runtime DLLs
        shell: pwsh
        run: |
          ./tools/windows/Add-LegacyDirectX.ps1 -DestinationDirectory './redist'

      - name: Validate Windows renderer and shader distribution
        shell: pwsh
        run: |
          ./tools/windows/Test-RoRWindowsPackage.ps1 -Directory './redist'
      - name: Smoke-test Windows renderer DLL loader dependencies
        shell: pwsh
        run: |
          ./tools/windows/Test-RendererPlugins.ps1 -DistributionDirectory './redist'
      - name: Upload build to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        if: env.BUTLER_API_KEY != null && github.ref == 'refs/heads/master'
        run: |
          choco install butler -y
          butler push redist rigs-of-rods/rigs-of-rods-dev:windows-ci --userversion CIBuild-%GITHUB_RUN_NUMBER%-Commit-%GITHUB_SHA%
        shell: cmd

      - name: Upload redist folder
        uses: actions/upload-artifact@v7
        with:
          name: ror-win
          path: redist

      # A development preview is only published after a successful full Windows
      # build and installation. A ZIP is essential: RoR.exe needs DLLs/resources.
      - name: Package and prerelease Windows graphics preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/graphics-overhaul'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $currentHead = (git ls-remote origin refs/heads/graphics-overhaul) -split '\s+'
          if ($currentHead[0] -ne $env:GITHUB_SHA) {
            Write-Host "Skipping prerelease because newer commits exist."
            exit 0
          }

          if (-not (Test-Path 'redist')) { throw "Missing game redist folder" }
          $gameExe = Get-ChildItem 'redist' -Filter 'RoR.exe' -Recurse -File
          if (-not $gameExe) { throw "No RoR.exe found in installed distribution" }

          $archive = 'RoR-Graphics-Preview-Windows.zip'
          Compress-Archive -Path 'redist\*' -DestinationPath $archive -CompressionLevel Optimal -Force
          if (-not (Test-Path $archive)) { throw "Failed to create Windows release ZIP" }

          $tag = "graphics-preview-$env:GITHUB_RUN_NUMBER"
          $notes = @'
          Experimental Rigs of Rods graphics preview for Windows.
          
          Extract the entire ZIP before launching RoR.exe. Do not run the executable by itself.
          Built automatically from the graphics-overhaul branch; gameplay and visual appearance are not verified.
          New source changes include configurable shadow distance, softer filtering, and opt-in natural SkyX lighting.
          The original master branch is not changed.
          '@
          $notes | Set-Content -Path 'release-notes.md' -Encoding UTF8
          gh release create $tag "./$archive" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "RoR Graphics Preview (Windows) #$env:GITHUB_RUN_NUMBER" --notes-file 'release-notes.md' --prerelease

      - name: Clean Conan pkgs
        run: conan cache clean "*" -sbd
        shell: cmd

