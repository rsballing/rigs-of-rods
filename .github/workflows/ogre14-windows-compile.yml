name: OGRE 14 Windows game compilation

# Full Windows game compile; source-contract checks are separate.
on:
  push:
    branches: [ogre14-migration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-game:
    name: Windows x64 RoR.exe (OGRE14)
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      BUILD_TOOLS_PATH: C:\apps\build-tools\
      CONAN_USER_HOME_SHORT: None
    steps:
      - name: Add Rigs of Rods build tools to PATH
        shell: pwsh
        run: '$env:BUILD_TOOLS_PATH | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Rigs of Rods build environment
        shell: cmd
        run: git clone https://git.anotherfoxguy.com/AnotherFoxGuy/build-tools.git %BUILD_TOOLS_PATH%

      - uses: actions/cache@v6
        with:
          key: ogre14-conan-win-${{ hashFiles('conanfile.py') }}
          path: ~/.conan2/

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Detect compiler and resolve public Conan remote
        shell: pwsh
        run: |
          conan profile detect --force
          conan remote add rigs-of-rods-deps https://conan.cloudsmith.io/rigs-of-rods/deps/ -f
          conan remote list
          cmake --version
          conan --version

      - name: Configure Windows OGRE 14 game
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Use an absolute, quoted provider path. On Windows, the unquoted
          # relative -D argument was split, leaving CMake looking for a
          # non-existent module named "cmake/conan_provider" and a stray ".cmake".
          $provider = (Resolve-Path 'cmake/conan_provider.cmake').Path
          if (-not (Test-Path -LiteralPath $provider -PathType Leaf)) {
            throw "Missing Conan CMake dependency provider: $provider"
          }
          $cmakeArgs = @(
            '-S', '.',
            '-B', 'build',
            '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release',
            "-DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=$provider",
            '-DCMAKE_INSTALL_PREFIX=redist',
            '-DROR_CREATE_CONTENT_FOLDER=ON'
          )
          Write-Host "Using Conan CMake provider: $provider"
          & cmake @cmakeArgs *> ogre14-configure.log
          $code = $LASTEXITCODE
          Get-Content ogre14-configure.log -Tail 160
          if ($code -ne 0) { throw "OGRE14 configure failed (exit $code)" }

      - name: Compile and install Windows OGRE 14 game
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & cmake --build build --target install --parallel 2 *> ogre14-build.log
          $code = $LASTEXITCODE
          Get-Content ogre14-build.log -Tail 180
          if ($code -ne 0) { throw "OGRE14 compilation failed (exit $code)" }

      - name: Verify built game and modern shader assets
        shell: pwsh
        run: |
          if (-not (Test-Path 'redist/RoR.exe' -PathType Leaf)) {
            throw "OGRE14 build did not install RoR.exe"
          }
          ./tools/windows/Test-RoRWindowsPackage.ps1 -Directory './redist'
          ./tools/windows/Test-RendererPlugins.ps1 -DistributionDirectory './redist'

      - name: Compile legacy managed-material Cg shader entry points
        shell: pwsh
        run: |
          python ./tools/windows/Test-CgShaders.py ./redist
          if ($LASTEXITCODE -ne 0) { throw "Legacy vehicle PSSM shaders cannot compile under OGRE14" }

      - name: Confirm RoR.exe loads all its static DLL imports
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'redist/RoR.exe').Path
          $wd = (Resolve-Path 'redist').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--ci-load-check' -WorkingDirectory $wd -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "OGRE14 RoR.exe DLL load check failed: exit $($process.ExitCode)" }

      - name: Upload diagnostic logs even if compilation fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ogre14-compile-diagnostics
          if-no-files-found: warn
          retention-days: 14
          path: |
            ogre14-configure.log
            ogre14-build.log
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeFiles/CMakeError.log
            build/CMakeFiles/CMakeOutput.log

      - name: Upload testable Windows game only after full build and DLL validation
        uses: actions/upload-artifact@v7
        with:
          name: ror-ogre14-windows-unverified-gpu
          path: redist/
          retention-days: 14

# A build artifact does not establish correct GPU shadows or collision visuals.
